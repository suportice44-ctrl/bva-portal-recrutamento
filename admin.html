
<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102238">
<title>Administração | BVA Recrutamento</title>
<style>
:root {
  --navy:#102238;
  --navy2:#19334f;
  --red:#bd292e;
  --bg:#f3f5f8;
  --white:#fff;
  --text:#263445;
  --muted:#718096;
  --border:#e1e6ed;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}
header{background:var(--navy);color:white;padding:24px 5%;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:22px}
header p{margin:6px 0 0;color:#c8d3df;font-size:13px}
main{max-width:1250px;margin:30px auto;padding:0 18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
input,select,textarea{font:inherit;padding:11px;border:1px solid var(--border);border-radius:7px;background:white;color:var(--text);width:100%}
.toolbar input{flex:1;min-width:200px}
.toolbar select{width:auto;min-width:160px}
button{border:0;border-radius:7px;padding:11px 16px;background:var(--navy);color:white;font-weight:bold;cursor:pointer}
button:hover{opacity:.9}
button.red{background:var(--red)}
button.light{background:#e8edf3;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:white;border:1px solid var(--border);border-radius:10px;padding:19px}
.stat span{font-size:13px;color:var(--muted)}
.stat strong{display:block;font-size:28px;margin-top:8px;color:var(--navy)}
.panel{background:white;border:1px solid var(--border);border-radius:10px;margin-top:22px;overflow:hidden}
.panel-head{padding:18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel-head h2{font-size:17px;margin:0}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{text-align:left;padding:14px;border-bottom:1px solid var(--border);font-size:13px}
th{background:#f8fafc;color:#526174}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfd}
.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf1f5;color:#435368;font-size:12px}
.status.Recebida{background:#e8efff;color:#3159a5}
.status.Em-análise{background:#fff2d8;color:#8a5a00}
.status.Aceite{background:#e0f5e9;color:#247346}
.status.Recusada{background:#fde8e8;color:#a52a2a}
.link-button{background:none;color:#bd292e;padding:5px;text-decoration:underline}
.empty,.loading{padding:35px;text-align:center;color:var(--muted)}
.details{display:none;padding:22px;border-top:1px solid var(--border);background:#fbfcfe}
.details.open{display:block}
.details h3{margin:0 0 18px;color:var(--navy)}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.detail-item{background:white;border:1px solid var(--border);padding:13px;border-radius:8px;min-width:0}
.detail-item.full{grid-column:1/-1}
.detail-item label{display:block;font-size:11px;color:var(--muted);font-weight:bold;text-transform:uppercase;margin-bottom:7px}
.detail-item p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.5}
.detail-item textarea{min-height:100px;resize:vertical}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.error{color:#b42318;background:#feeceb;padding:12px;border-radius:7px;margin:15px 0;display:none}
.success{color:#176b3a;background:#e6f5eb;padding:12px;border-radius:7px;margin:15px 0;display:none}
@media(max-width:750px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .detail-grid{grid-template-columns:1fr}
 .detail-item.full{grid-column:auto}
}
@media(max-width:420px){
 .stats{grid-template-columns:1fr 1fr;gap:8px}
 .stat{padding:13px}
 .stat strong{font-size:23px}
}
</style>
</head>
<body>

<header>
  <div>
    <h1>BVA | Administração</h1>
    <p>Painel de gestão de recrutamento</p>
  </div>
  <button class="red" id="refreshButton">Atualizar dados</button>
</header>

<main>
  <section class="stats">
    <div class="stat"><span>Total de candidaturas</span><strong id="total">0</strong></div>
    <div class="stat"><span>Recebidas</span><strong id="received">0</strong></div>
    <div class="stat"><span>Em análise</span><strong id="analysis">0</strong></div>
    <div class="stat"><span>Aceites</span><strong id="accepted">0</strong></div>
  </section>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Pesquisar por nome, Discord ou função...">
    <select id="filter">
      <option value="">Todos os estados</option>
      <option value="Recebida">Recebida</option>
      <option value="Em análise">Em análise</option>
      <option value="Aceite">Aceite</option>
      <option value="Recusada">Recusada</option>
    </select>
    <button id="exportButton" class="light">Exportar CSV</button>
  </div>

  <div id="error" class="error"></div>
  <div id="success" class="success"></div>

  <section class="panel">
    <div class="panel-head">
      <h2>Lista de candidaturas</h2>
      <span id="count">0 resultados</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Candidato</th>
            <th>Discord</th>
            <th>Função pretendida</th>
            <th>Data</th>
            <th>Estado</th>
            <th>Detalhes</th>
          </tr>
        </thead>
        <tbody id="applications">
          <tr><td colspan="6" class="loading">A carregar candidaturas...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="details" class="details"></div>
  </section>
</main>

<script>
const API = "/api/admin/candidaturas";
let applications = [];
let selectedId = null;

const $ = id => document.getElementById(id);

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function showError(message) {
  $("error").textContent = message;
  $("error").style.display = "block";
  $("success").style.display = "none";
}

function showSuccess(message) {
  $("success").textContent = message;
  $("success").style.display = "block";
  $("error").style.display = "none";
}

function clearMessages() {
  $("error").style.display = "none";
  $("success").style.display = "none";
}

function statusClass(status) {
  return String(status || "Recebida").replace(/\s+/g, "-");
}

function formatDate(value) {
  if (!value) return "—";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return escapeHTML(value);
  return date.toLocaleString("pt-PT");
}

function updateStats() {
  $("total").textContent = applications.length;
  $("received").textContent =
    applications.filter(a => a.estado === "Recebida").length;
  $("analysis").textContent =
    applications.filter(a => a.estado === "Em análise").length;
  $("accepted").textContent =
    applications.filter(a => a.estado === "Aceite").length;
}

function filteredApplications() {
  const term = $("search").value.trim().toLowerCase();
  const status = $("filter").value;

  return applications.filter(a => {
    const searchable = [
      a.nome, a.discord, a.funcao_pretendida,
      a.id, a.disponibilidade, a.areas_atividade
    ].join(" ").toLowerCase();

    return (!term || searchable.includes(term)) &&
      (!status || a.estado === status);
  });
}

function renderApplications() {
  const list = filteredApplications();
  $("count").textContent = `${list.length} resultados`;

  if (!list.length) {
    $("applications").innerHTML =
      '<tr><td colspan="6" class="empty">Não foram encontradas candidaturas.</td></tr>';
    $("details").classList.remove("open");
    return;
  }

  $("applications").innerHTML = list.map(a => `
    <tr>
      <td><strong>${escapeHTML(a.nome)}</strong></td>
      <td>${escapeHTML(a.discord)}</td>
      <td>${escapeHTML(a.funcao_pretendida)}</td>
      <td>${formatDate(a.data_criacao)}</td>
      <td><span class="status ${statusClass(a.estado)}">${escapeHTML(a.estado || "Recebida")}</span></td>
      <td><button class="link-button" data-open="${escapeHTML(a.id)}">Ver candidatura</button></td>
    </tr>
  `).join("");

  document.querySelectorAll("[data-open]").forEach(button => {
    button.addEventListener("click", () => {
      openDetails(button.dataset.open);
    });
  });
}

function field(label, value, full = false) {
  return `
    <div class="detail-item ${full ? "full" : ""}">
      <label>${escapeHTML(label)}</label>
      <p>${escapeHTML(value || "Não indicado")}</p>
    </div>
  `;
}

function openDetails(id) {
  const a = applications.find(item => String(item.id) === String(id));
  if (!a) return;

  selectedId = a.id;

  $("details").innerHTML = `
    <h3>Detalhes da candidatura — ${escapeHTML(a.nome)}</h3>

    <div class="detail-grid">
      ${field("Nome", a.nome)}
      ${field("Idade", a.idade)}
      ${field("Discord", a.discord)}
      ${field("Função pretendida", a.funcao_pretendida)}
      ${field("Disponibilidade", a.disponibilidade)}
      ${field("Áreas de atividade", a.areas_atividade, true)}
      ${field("Experiência", a.experiencia)}
      ${field("Detalhes da experiência", a.experiencia_detalhe, true)}
      ${field("Motivação", a.motivacao, true)}
      ${field("Qualidades", a.qualidades, true)}
      ${field("Compromisso", a.compromisso, true)}
      ${field("Questão 1", a.q1, true)}
      ${field("Questão 2", a.q2, true)}
      ${field("Questão 3", a.q3, true)}
      ${field("Situação prática", a.situacao_pratica, true)}
      ${field("Gestão de conflitos", a.conflito, true)}
      ${field("Data de candidatura", formatDate(a.data_criacao))}
    </div>

    <div style="margin-top:22px">
      <label for="newStatus"><strong>Estado da candidatura</strong></label>
      <select id="newStatus" style="margin-top:8px;max-width:300px">
        ${["Recebida","Em análise","Aceite","Recusada"].map(s =>
          `<option value="${s}" ${a.estado === s ? "selected" : ""}>${s}</option>`
        ).join("")}
      </select>
    </div>

    <div style="margin-top:18px">
      <label for="internalNotes"><strong>Notas internas</strong></label>
      <textarea id="internalNotes" placeholder="Escrever notas para a equipa...">${escapeHTML(a.notas_internas || "")}</textarea>
    </div>

    <div class="actions">
      <button id="saveStatus">Guardar estado</button>
      <button id="saveNotes" class="light">Guardar notas</button>
      <button id="closeDetails" class="light">Fechar detalhes</button>
    </div>
  `;

  $("details").classList.add("open");
  $("saveStatus").addEventListener("click", saveStatus);
  $("saveNotes").addEventListener("click", saveNotes);
  $("closeDetails").addEventListener("click", () => {
    $("details").classList.remove("open");
    selectedId = null;
  });

  $("details").scrollIntoView({ behavior:"smooth", block:"start" });
}

async function updateApplication(data) {
  if (selectedId === null) return;

  const response = await fetch(
    `${API}/${encodeURIComponent(selectedId)}`,
    {
      method: "PATCH",
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify(data)
    }
  );

  const result = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(result.error || "Não foi possível guardar as alterações.");
  }

  return result;
}

async function saveStatus() {
  clearMessages();

  try {
    const estado = $("newStatus").value;
    await updateApplication({ estado });

    const item = applications.find(a => String(a.id) === String(selectedId));
    if (item) item.estado = estado;

    updateStats();
    renderApplications();
    openDetails(selectedId);
    showSuccess("Estado atualizado com sucesso.");
  } catch (error) {
    showError(error.message);
  }
}

async function saveNotes() {
  clearMessages();

  try {
    const notas_internas = $("internalNotes").value;
    await updateApplication({ notas_internas });

    const item = applications.find(a => String(a.id) === String(selectedId));
    if (item) item.notas_internas = notas_internas;

    showSuccess("Notas internas guardadas com sucesso.");
  } catch (error) {
    showError(error.message);
  }
}

async function loadApplications() {
  clearMessages();
  $("applications").innerHTML =
    '<tr><td colspan="6" class="loading">A carregar candidaturas...</td></tr>';

  try {
    const response = await fetch(API, {
      headers: { "Accept":"application/json" },
      cache: "no-store"
    });

    if (!response.ok) {
      if (response.status === 401) {
        throw new Error("Sessão não autenticada. Atualiza a página e inicia sessão novamente.");
      }
      throw new Error("Não foi possível carregar as candidaturas.");
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error("A resposta do servidor não é válida.");
    }

    applications = data;
    updateStats();
    renderApplications();

  } catch (error) {
    showError(error.message);
    $("applications").innerHTML =
      '<tr><td colspan="6" class="empty">Erro ao carregar os dados.</td></tr>';
  }
}

function exportCSV() {
  const list = filteredApplications();

  if (!list.length) {
    showError("Não existem candidaturas para exportar.");
    return;
  }

  const columns = [
    "id","nome","idade","discord","disponibilidade",
    "areas_atividade","experiencia","funcao_pretendida",
    "experiencia_detalhe","motivacao","qualidades",
    "compromisso","q1","q2","q3","situacao_pratica",
    "conflito","estado","notas_internas","data_criacao"
  ];

  const csvCell = value =>
    '"' + String(value ?? "").replace(/"/g, '""') + '"';

  const csv = [
    columns.join(";"),
    ...list.map(item =>
      columns.map(column => csvCell(item[column])).join(";")
    )
  ].join("\r\n");

  const blob = new Blob(["\uFEFF" + csv], {
    type:"text/csv;charset=utf-8;"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "candidaturas-bva.csv";
  link.click();
  URL.revokeObjectURL(url);
}

$("refreshButton").addEventListener("click", loadApplications);
$("search").addEventListener("input", renderApplications);
$("filter").addEventListener("change", renderApplications);
$("exportButton").addEventListener("click", exportCSV);

loadApplications();
</script>
</body>
  </html>
