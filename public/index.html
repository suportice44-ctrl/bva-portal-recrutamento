
<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101923">
  <meta name="description" content="Portal institucional da comunidade Bombeiros Voluntários do Algarve. Projeto fictício de simulação e roleplay.">
  <title>Bombeiros Voluntários do Algarve | Portal Institucional</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #101923;
      --navy-2: #182738;
      --navy-3: #24394e;
      --red: #bd2932;
      --red-dark: #991e27;
      --gold: #d5b477;
      --white: #ffffff;
      --light: #f4f6f8;
      --text: #293746;
      --muted: #748190;
      --border: #e2e7ed;
      --container: 1200px;
      --shadow: 0 18px 50px rgba(15,27,39,.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--text);
      background: var(--white);
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, select, textarea {
      font: inherit;
    }

    img {
      display: block;
      width: 100%;
    }

    .container {
      width: min(var(--container), calc(100% - 44px));
      margin: auto;
    }

    /* TOP BAR */

    .topbar {
      background: #080e15;
      color: #bdc8d2;
      font-size: 10px;
      letter-spacing: .5px;
    }

    .topbar-inner {
      min-height: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .topbar strong {
      color: white;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #69b987;
      border-radius: 50%;
    }

    /* HEADER */

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(16,25,35,.98);
      border-bottom: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
    }

    .navigation {
      min-height: 84px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 49px;
      height: 49px;
      display: grid;
      place-items: center;
      background: var(--red);
      border: 2px solid rgba(255,255,255,.9);
      border-radius: 50%;
      font-family: Manrope, sans-serif;
      font-size: 14px;
      font-weight: 800;
    }

    .brand-name {
      font-family: Manrope, sans-serif;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: .5px;
    }

    .brand-name small {
      display: block;
      margin-top: 4px;
      color: #aab7c3;
      font-size: 9px;
      letter-spacing: 2px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 19px;
      list-style: none;
    }

    .nav-links a {
      color: #d5dde5;
      font-size: 10px;
      font-weight: 700;
      transition: color .2s;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .nav-links .nav-apply {
      padding: 12px 16px;
      color: white;
      background: var(--red);
      border-radius: 3px;
    }

    .menu-toggle {
      display: none;
      padding: 9px 12px;
      color: white;
      background: transparent;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 3px;
      cursor: pointer;
    }

    /* HERO */

    .hero {
      min-height: 680px;
      display: flex;
      align-items: center;
      position: relative;
      color: white;
      background:
        linear-gradient(90deg, rgba(5,12,20,.96), rgba(5,12,20,.78) 52%, rgba(5,12,20,.25)),
        url("https://commons.wikimedia.org/wiki/Special:FilePath/12-09-2017%20Bombeiros%20de%20Faro%20Cruz-Lusa%2C%20Rua%20Comandante%20Francisco%20Manuel%2C%20Faro%20%282%29.JPG")
        center / cover no-repeat;
    }

    .hero-content {
      max-width: 760px;
      padding: 110px 0;
    }

    .hero-kicker {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    .hero-kicker::before {
      content: "";
      width: 35px;
      height: 2px;
      background: var(--red);
    }

    .hero h1 {
      font-family: Manrope, sans-serif;
      font-size: clamp(43px, 6vw, 77px);
      line-height: 1.08;
      letter-spacing: -3px;
      margin-bottom: 25px;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero-description {
      max-width: 600px;
      color: #d0d9e2;
      font-size: 14px;
      line-height: 1.9;
      margin-bottom: 34px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 49px;
      padding: 13px 22px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .8px;
      text-transform: uppercase;
      transition: .2s;
      cursor: pointer;
    }

    .button-red {
      color: white;
      background: var(--red);
    }

    .button-red:hover {
      background: var(--red-dark);
      transform: translateY(-2px);
    }

    .button-outline {
      color: white;
      border: 1px solid rgba(255,255,255,.6);
    }

    .button-outline:hover {
      color: var(--navy);
      background: white;
    }

    .hero-caption {
      position: absolute;
      right: 22px;
      bottom: 15px;
      color: rgba(255,255,255,.65);
      font-size: 9px;
    }

    /* NOTICE */

    .notice {
      padding: 23px 0;
      color: white;
      background: var(--red);
    }

    .notice-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .notice strong {
      font-family: Manrope, sans-serif;
      font-size: 17px;
    }

    .notice p {
      max-width: 650px;
      color: rgba(255,255,255,.9);
      font-size: 11px;
    }

    /* GENERAL SECTIONS */

    .section {
      padding: 95px 0;
    }

    .section-heading {
      max-width: 740px;
      margin-bottom: 43px;
    }

    .section-kicker {
      margin-bottom: 12px;
      color: var(--red);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    .section-heading h2,
    .about-content h2,
    .structure-copy h2 {
      margin-bottom: 16px;
      color: var(--navy);
      font-family: Manrope, sans-serif;
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1.2;
      letter-spacing: -1.2px;
    }

    .section-heading p,
    .about-content p,
    .structure-copy p {
      color: var(--muted);
      font-size: 13px;
    }

    /* ABOUT */

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 60px;
    }

    .about-photo {
      min-height: 470px;
      position: relative;
      background:
        url("https://commons.wikimedia.org/wiki/Special:FilePath/Associa%C3%A7%C3%A3o%20Humanit%C3%A1ria%20de%20Bombeiros%20Volunt%C3%A1rios%20de%20Faro%20-%20Cruz%20Lusa%2002.jpg")
        center / cover no-repeat;
      box-shadow: var(--shadow);
    }

    .photo-label {
      position: absolute;
      left: 16px;
      bottom: 16px;
      padding: 9px 13px;
      color: white;
      background: rgba(16,25,35,.92);
      font-size: 10px;
    }

    .about-content h2 {
      font-size: 36px;
    }

    .about-content p {
      margin-bottom: 15px;
    }

    .facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 27px;
    }

    .fact {
      padding-left: 13px;
      border-left: 3px solid var(--red);
    }

    .fact strong {
      display: block;
      color: var(--navy);
      font-size: 12px;
    }

    .fact span {
      color: var(--muted);
      font-size: 10px;
    }

    /* VALUES */

    .dark-section {
      background: var(--navy);
    }

    .dark-section .section-heading h2 {
      color: white;
    }

    .dark-section .section-heading p {
      color: #aebbc7;
    }

    .dark-section .section-kicker {
      color: var(--gold);
    }

    .values-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .value-card {
      min-height: 220px;
      padding: 27px 22px;
      border: 1px solid rgba(255,255,255,.13);
      background: rgba(255,255,255,.035);
      transition: .25s;
    }

    .value-card:hover {
      transform: translateY(-5px);
      border-color: var(--gold);
      background: rgba(255,255,255,.07);
    }

    .value-number {
      color: var(--gold);
      font-family: Manrope, sans-serif;
      font-size: 14px;
      font-weight: 800;
    }

    .value-card h3 {
      margin: 24px 0 9px;
      color: white;
      font-family: Manrope, sans-serif;
      font-size: 16px;
    }

    .value-card p {
      color: #adbac6;
      font-size: 11px;
    }

    /* AREAS */

    .areas-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .area-card {
      padding: 28px;
      border: 1px solid var(--border);
      background: white;
      transition: .25s;
    }

    .area-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .area-number {
      color: var(--red);
      font-family: Manrope, sans-serif;
      font-size: 22px;
      font-weight: 800;
    }

    .area-card h3 {
      margin: 12px 0 9px;
      color: var(--navy);
      font-family: Manrope, sans-serif;
      font-size: 15px;
    }

    .area-card p {
      color: var(--muted);
      font-size: 11px;
    }

    /* STRUCTURE */

    .structure-section {
      background: var(--light);
    }

    .structure-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 55px;
    }

    .structure-panel {
      padding: 36px;
      color: white;
      background: var(--navy);
      box-shadow: var(--shadow);
    }

    .structure-panel small {
      color: var(--gold);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .structure-panel h3 {
      margin: 10px 0 23px;
      font-family: Manrope, sans-serif;
      font-size: 26px;
    }

    .structure-item {
      padding: 13px 15px;
      margin-top: 9px;
      background: rgba(255,255,255,.07);
      border-left: 3px solid var(--red);
    }

    .structure-item strong {
      display: block;
      font-size: 12px;
    }

    .structure-item span {
      color: #b3bfca;
      font-size: 10px;
    }

    .structure-copy p {
      margin-bottom: 15px;
    }

    /* GALLERY */

    .gallery-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      grid-template-rows: 210px 210px;
      gap: 13px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      background: var(--navy-3);
    }

    .gallery-item:first-child {
      grid-row: span 2;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .45s;
    }

    .gallery-item:hover img {
      transform: scale(1.06);
    }

    .gallery-item span {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 35px 15px 13px;
      color: white;
      font-size: 10px;
      font-weight: 700;
      background: linear-gradient(transparent, rgba(0,0,0,.85));
    }

    /* RECRUITMENT */

    .recruitment {
      color: white;
      background:
        linear-gradient(rgba(7,15,24,.94), rgba(7,15,24,.94)),
        url("https://commons.wikimedia.org/wiki/Special:FilePath/12-09-2017%20Fire%20Tender%2C%20Bombeiros%20de%20Faro%20Cruz-Lusa%2C%20Rua%20Comandante%20Francisco%20Manuel%2C%20Faro%20%281%29.JPG")
        center / cover no-repeat;
    }

    .recruitment .section-kicker {
      color: var(--gold);
    }

    .recruitment .section-heading h2 {
      color: white;
    }

    .recruitment .section-heading p {
      color: #bdc7d0;
    }

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .step {
      padding: 24px 19px;
      border-top: 2px solid var(--red);
      background: rgba(255,255,255,.07);
    }

    .step-number {
      color: var(--gold);
      font-family: Manrope, sans-serif;
      font-size: 26px;
      font-weight: 800;
    }

    .step h3 {
      margin: 12px 0 8px;
      font-size: 13px;
    }

    .step p {
      color: #bdc7d0;
      font-size: 11px;
    }

    .recruitment-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 22px;
      margin-top: 32px;
      padding: 24px;
      border: 1px solid rgba(255,255,255,.2);
    }

    .recruitment-banner strong {
      font-family: Manrope, sans-serif;
      font-size: 17px;
    }

    .recruitment-banner p {
      color: #bdc7d0;
      font-size: 11px;
    }

    /* FAQ */

    .faq-list {
      max-width: 850px;
      display: grid;
      gap: 11px;
    }

    .faq-list details {
      padding: 18px 20px;
      border: 1px solid var(--border);
      background: white;
    }

    .faq-list summary {
      color: var(--navy);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .faq-list details p {
      padding-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    /* APPLICATION */

    .application-section {
      background: var(--light);
    }

    .application-grid {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      align-items: start;
      gap: 30px;
    }

    .application-info {
      padding: 33px;
      color: white;
      background: var(--navy);
    }

    .application-info .section-kicker {
      color: var(--gold);
    }

    .application-info h2 {
      margin-bottom: 16px;
      font-family: Manrope, sans-serif;
      font-size: 29px;
      line-height: 1.2;
    }

    .application-info p {
      margin-bottom: 22px;
      color: #bdc7d0;
      font-size: 12px;
    }

    .application-info ul {
      display: grid;
      gap: 11px;
      list-style: none;
    }

    .application-info li {
      color: #e1e7ec;
      font-size: 11px;
    }

    .application-info li::before {
      content: "✓";
      margin-right: 9px;
      color: var(--gold);
    }

    .application-form {
      padding: 33px;
      background: white;
      border: 1px solid var(--border);
      box-shadow: 0 12px 35px rgba(16,25,35,.05);
    }

    .form-heading {
      padding-bottom: 18px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .form-heading h3 {
      color: var(--navy);
      font-family: Manrope, sans-serif;
      font-size: 21px;
    }

    .form-heading p {
      color: var(--muted);
      font-size: 11px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 15px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      color: var(--navy);
      font-size: 11px;
      font-weight: 800;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      min-height: 45px;
      padding: 11px 12px;
      color: var(--text);
      background: #fbfcfd;
      border: 1px solid #dce2e8;
      border-radius: 3px;
      outline: none;
      font-size: 12px;
    }

    .form-group textarea {
      min-height: 115px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--red);
    }

    .submit-button {
      width: 100%;
      min-height: 49px;
      color: white;
      background: var(--red);
      border: 0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .8px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .submit-button:hover {
      background: var(--red-dark);
    }

    #formMessage {
      margin-top: 13px;
      font-size: 12px;
      font-weight: 700;
    }

    .disclaimer {
      margin-top: 18px;
      padding: 12px;
      color: #78613a;
      background: #fff8e9;
      border-left: 3px solid var(--gold);
      font-size: 10px;
    }

    /* FOOTER */

    .footer {
      padding: 55px 0 20px;
      color: white;
      background: #080e15;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 40px;
      padding-bottom: 35px;
    }

    .footer-about p {
      max-width: 350px;
      margin-top: 16px;
      color: #9eabb8;
      font-size: 11px;
    }

    .footer h4 {
      margin-bottom: 15px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .footer-links {
      display: grid;
      gap: 9px;
      list-style: none;
    }

    .footer-links a {
      color: #9eabb8;
      font-size: 11px;
    }

    .footer-links a:hover {
      color: white;
    }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding-top: 19px;
      border-top: 1px solid rgba(255,255,255,.1);
      color: #84919e;
      font-size: 10px;
    }

    /* RESPONSIVE */

    @media (max-width: 950px) {
      .nav-links {
        gap: 10px;
      }

      .nav-links a {
        font-size: 9px;
      }

      .values-grid,
      .steps-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 760px) {
      .navigation {
        min-height: 72px;
      }

      .menu-toggle {
        display: block;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 72px;
        left: 0;
        right: 0;
        padding: 16px 22px 22px;
        background: var(--navy);
        flex-direction: column;
        align-items: stretch;
        gap: 0;
      }

      .nav-links.open {
        display: flex;
      }

      .nav-links a {
        display: block;
        padding: 11px 0;
        font-size: 12px;
      }

      .nav-links .nav-apply {
        text-align: center;
        margin-top: 8px;
      }

      .hero {
        min-height: 560px;
        background-position: 60% center;
      }

      .hero h1 {
        font-size: 46px;
        letter-spacing: -1.5px;
      }

      .notice-inner {
        align-items: flex-start;
        flex-direction: column;
        gap: 7px;
      }

      .section {
        padding: 68px 0;
      }

      .about-grid,
      .structure-grid,
      .application-grid {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .about-photo {
        min-height: 330px;
      }

      .areas-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .gallery-grid {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 220px 160px 160px;
      }

      .gallery-item:first-child {
        grid-column: span 2;
        grid-row: auto;
      }

      .recruitment-banner {
        align-items: flex-start;
        flex-direction: column;
      }

      .footer-grid {
        grid-template-columns: 1fr 1fr;
      }

      .footer-about {
        grid-column: 1 / -1;
      }
    }
