
<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101923">
  <meta name="description" content="Bombeiros Voluntários do Algarve — Portal institucional e recrutamento da comunidade de simulação BVA.">
  <title>BVA | Bombeiros Voluntários do Algarve</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #101923;
      --navy-2: #172432;
      --navy-3: #223447;
      --red: #c62832;
      --red-dark: #a51e29;
      --gold: #d9ad64;
      --white: #fff;
      --light: #f4f6f8;
      --text: #263445;
      --muted: #738091;
      --border: #e4e8ed;
      --container: 1180px;
      --shadow: 0 18px 50px rgba(16,25,35,.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; scroll-padding-top: 90px; }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--text);
      background: #fff;
      line-height: 1.7;
    }

    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    img { max-width: 100%; display: block; }

    .container {
      width: min(var(--container), calc(100% - 44px));
      margin-inline: auto;
    }

    .topbar {
      background: #0b121a;
      color: #d8e0e8;
      font-size: 12px;
      letter-spacing: .5px;
    }

    .topbar-inner {
      min-height: 38px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .topbar strong { color: #fff; font-weight: 700; }

    .topbar-right {
      display: flex;
      gap: 22px;
      align-items: center;
    }

    .topbar-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #57bd83;
      margin-right: 7px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(16,25,35,.97);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .nav {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      color: #fff;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 2px solid rgba(255,255,255,.75);
      border-radius: 50%;
      font-family: "Manrope", sans-serif;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -1px;
      position: relative;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid var(--red);
      border-radius: 50%;
    }

    .brand-name {
      font-family: "Manrope", sans-serif;
      font-size: 15px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: .4px;
    }

    .brand-name small {
      display: block;
      margin-top: 5px;
      color: #aeb9c5;
      font-size: 9px;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
      list-style: none;
    }

    .nav-links a {
      color: #d4dce4;
      font-size: 12px;
      font-weight: 700;
      transition: color .2s;
    }

    .nav-links a:hover { color: #fff; }

    .nav-cta {
      background: var(--red);
      color: #fff !important;
      padding: 12px 19px;
      border-radius: 3px;
      transition: background .2s;
    }

    .nav-cta:hover { background: var(--red-dark); }

    .menu-toggle {
      display: none;
      background: transparent;
      border: 1px solid rgba(255,255,255,.3);
      color: #fff;
      border-radius: 4px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .hero {
      min-height: 650px;
      display: flex;
      align-items: center;
      position: relative;
      color: #fff;
      background:
        linear-gradient(90deg, rgba(8,15,23,.94) 0%, rgba(8,15,23,.78) 48%, rgba(8,15,23,.25) 100%),
        linear-gradient(0deg, rgba(8,15,23,.48), transparent 50%),
        url("https://commons.wikimedia.org/wiki/Special:FilePath/12-09-2017%20Bombeiros%20de%20Faro%20Cruz-Lusa%2C%20Rua%20Comandante%20Francisco%20Manuel%2C%20Faro%20%282%29.JPG")
        center 55% / cover no-repeat;
    }

    .hero-content {
      max-width: 760px;
      padding: 100px 0 115px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 23px;
    }

    .eyebrow::before {
      content: "";
      width: 35px;
      height: 2px;
      background: var(--red);
    }

    .hero h1 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(42px, 6vw, 76px);
      line-height: 1.08;
      letter-spacing: -2.8px;
      font-weight: 800;
      max-width: 760px;
      margin-bottom: 25px;
    }

    .hero h1 span { color: #e6b86f; }

    .hero-description {
      max-width: 590px;
      color: #d2d9e0;
      font-size: 16px;
      line-height: 1.9;
      margin-bottom: 35px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
    }

    .btn {
      min-height: 51px;
      padding: 14px 23px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .6px;
      text-transform: uppercase;
      border-radius: 3px;
      transition: .2s;
    }

    .btn-primary { background: var(--red); color: #fff; }
    .btn-primary:hover { background: var(--red-dark); transform: translateY(-2px); }

    .btn-outline {
      color: #fff;
      border: 1px solid rgba(255,255,255,.55);
    }

    .btn-outline:hover { background: #fff; color: var(--navy); }

    .hero-note {
      position: absolute;
      bottom: 25px;
      right: max(22px, calc((100% - var(--container)) / 2));
      color: rgba(255,255,255,.7);
      font-size: 10px;
      letter-spacing: .5px;
    }

    .intro-strip {
      background: var(--red);
      color: #fff;
    }

    .intro-strip-inner {
      min-height: 95px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .intro-strip strong {
      font-family: "Manrope", sans-serif;
      font-size: 18px;
    }

    .intro-strip p {
      color: rgba(255,255,255,.85);
      font-size: 13px;
      max-width: 600px;
    }

    .section { padding: 105px 0; }

    .section-heading {
      max-width: 720px;
      margin-bottom: 48px;
    }

    .section-label {
      color: var(--red);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 13px;
    }

    .section-heading h2 {
      font-family: "Manrope", sans-serif;
      color: var(--navy);
      font-size: clamp(30px, 4vw, 45px);
      line-height: 1.2;
      letter-spacing: -1.5px;
      margin-bottom: 17px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 15px;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 75px;
      align-items: center;
    }

    .about-image {
      min-height: 470px;
      position: relative;
      background:
        linear-gradient(0deg, rgba(10,18,26,.22), transparent),
        url("https://commons.wikimedia.org/wiki/Special:FilePath/Associa%C3%A7%C3%A3o%20Humanit%C3%A1ria%20de%20Bombeiros%20Volunt%C3%A1rios%20de%20Faro%20-%20Cruz%20Lusa%2002.jpg")
        center / cover no-repeat;
      border-radius: 4px;
      box-shadow: var(--shadow);
    }

    .about-image-caption {
      position: absolute;
      bottom: 18px;
      left: 18px;
      background: rgba(16,25,35,.88);
      color: #fff;
      padding: 10px 14px;
      font-size: 10px;
      letter-spacing: .5px;
    }

    .about-copy .section-label { margin-bottom: 12px; }

    .about-copy h2 {
      font-family: "Manrope", sans-serif;
      font-size: 39px;
      line-height: 1.2;
      letter-spacing: -1.5px;
      color: var(--navy);
      margin-bottom: 23px;
    }

    .about-copy p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 17px;
    }

    .about-points {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 17px;
      margin-top: 30px;
    }

    .about-point {
      border-left: 3px solid var(--red);
      padding: 4px 0 4px 13px;
    }

    .about-point strong {
      display: block;
      color: var(--navy);
      font-size: 13px;
    }

    .about-point span {
      color: var(--muted);
      font-size: 11px;
    }

    .dark-section {
      background: var(--navy);
      color: #fff;
    }

    .dark-section .section-heading h2 { color: #fff; }
    .dark-section .section-heading p { color: #aebbc8; }
    .dark-section .section-label { color: var(--gold); }

    .values-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 17px;
    }

    .value-card {
      padding: 30px 25px;
      min-height: 230px;
      border: 1px solid rgba(255,255,255,.13);
      background: rgba(255,255,255,.035);
      transition: .25s;
    }

    .value-card:hover {
      background: rgba(255,255,255,.08);
      transform: translateY(-5px);
      border-color: rgba(217,173,100,.5);
    }

    .value-number {
      color: var(--gold);
      font-family: "Manrope", sans-serif;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 28px;
    }

    .value-card h3 {
      font-family: "Manrope", sans-serif;
      font-size: 18px;
      margin-bottom: 12px;
    }

    .value-card p {
      color: #aebbc8;
      font-size: 12px;
      line-height: 1.8;
    }

    .areas-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .area-card {
      background: #fff;
      border: 1px solid var(--border);
      padding: 31px;
      border-radius: 4px;
      transition: .2s;
    }

    .area-card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-4px);
    }

    .area-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      background: #fff0f0;
      color: var(--red);
      font-size: 21px;
      border-radius: 4px;
      margin-bottom: 22px;
    }

    .area-card h3 {
      font-family: "Manrope", sans-serif;
      color: var(--navy);
      font-size: 17px;
      margin-bottom: 11px;
    }

    .area-card p {
      color: var(--muted);
      font-size: 13px;
    }

    .structure-section { background: var(--light); }

    .structure-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 55px;
      align-items: center;
    }

    .structure-visual {
      background: var(--navy);
      color: #fff;
      padding: 42px;
      border-radius: 4px;
      box-shadow: var(--shadow);
    }

    .structure-visual small {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .structure-visual h3 {
      font-family: "Manrope", sans-serif;
      font-size: 27px;
      margin: 10px 0 28px;
    }

    .structure-level {
      padding: 15px 17px;
      margin-top: 10px;
      background: rgba(255,255,255,.07);
      border-left: 3px solid var(--red);
    }

    .structure-level strong {
      display: block;
      font-size: 13px;
    }

    .structure-level span {
      color: #aebbc8;
      font-size: 11px;
    }

    .structure-copy h2 {
      color: var(--navy);
      font-family: "Manrope", sans-serif;
      font-size: 36px;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .structure-copy p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .structure-copy .btn { margin-top: 15px; }

    .gallery-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      grid-template-rows: 210px 210px;
      gap: 13px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 3px;
      background: var(--navy-3);
    }

    .gallery-item:first-child { grid-row: span 2; }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .5s;
    }

    .gallery-item:hover img { transform: scale(1.06); }

    .gallery-item span {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 30px 17px 15px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      background: linear-gradient(transparent, rgba(0,0,0,.75));
    }

    .recruitment {
      background:
        linear-gradient(90deg, rgba(12,20,29,.96), rgba(12,20,29,.83)),
        url("https://commons.wikimedia.org/wiki/Special:FilePath/12-09-2017%20Fire%20Tender%2C%20Bombeiros%20de%20Faro%20Cruz-Lusa%2C%20Rua%20Comandante%20Francisco%20Manuel%2C%20Faro%20%281%29.JPG")
        center / cover no-repeat;
      color: #fff;
    }

    .recruitment .section-heading h2 { color: #fff; }
    .recruitment .section-heading p { color: #c0cad4; }
    .recruitment .section-label { color: var(--gold); }

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 45px;
    }

    .step {
      padding: 25px 20px;
      border-top: 2px solid var(--red);
      background: rgba(255,255,255,.07);
    }

    .step-number {
      color: var(--gold);
      font-family: "Manrope", sans-serif;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .step h3 { font-size: 15px; margin-bottom: 9px; }
    .step p { color: #b8c3ce; font-size: 12px; }

    .recruitment-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
      padding: 27px 30px;
      border: 1px solid rgba(255,255,255,.2);
    }

    .recruitment-action strong {
      display: block;
      font-family: "Manrope", sans-serif;
      font-size: 19px;
    }

    .recruitment-action span {
      color: #b8c3ce;
      font-size: 12px;
    }

    .faq-list {
      max-width: 850px;
      display: grid;
      gap: 11px;
    }

    details {
      border: 1px solid var(--border);
      background: #fff;
      padding: 19px 22px;
      border-radius: 3px;
    }

    summary {
      color: var(--navy);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    details p {
      color: var(--muted);
      font-size: 13px;
      padding-top: 13px;
    }

    .application-section { background: var(--light); }

    .application-layout {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 50px;
      align-items: start;
    }

    .application-info {
      background: var(--navy);
      color: #fff;
      padding: 35px;
      border-radius: 4px;
      position: sticky;
      top: 110px;
    }

    .application-info .section-label { color: var(--gold); }

    .application-info h2 {
      font-family: "Manrope", sans-serif;
      font-size: 31px;
      line-height: 1.2;
      margin-bottom: 17px;
    }

    .application-info p {
      color: #b8c3ce;
      font-size: 13px;
      margin-bottom: 23px;
    }

    .application-info ul {
      list-style: none;
      display: grid;
      gap: 13px;
    }

    .application-info li {
      font-size: 12px;
      color: #e1e6eb;
      padding-left: 19px;
      position: relative;
    }

    .application-info li::before {
      content: "✓";
      color: var(--gold);
      position: absolute;
      left: 0;
      font-weight: 800;
    }

    .application-form {
      background: #fff;
      border: 1px solid var(--border);
      padding: 37px;
      border-radius: 4px;
      box-shadow: 0 12px 35px rgba(16,25,35,.05);
    }

    .form-heading {
      margin-bottom: 27px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .form-heading h3 {
      color: var(--navy);
      font-family: "Manrope", sans-serif;
      font-size: 22px;
    }

    .form-heading p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 17px;
    }

    .form-group.full { grid-column: 1 / -1; }

    .form-group label {
      color: var(--navy);
      font-size: 12px;
      font-weight: 800;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      min-height: 47px;
      padding: 12px 14px;
      border: 1px solid #dce2e8;
      border-radius: 3px;
      background: #fbfcfd;
      color: var(--text);
      outline: none;
      font-size: 13px;
      transition: border .2s;
    }

    .form-group textarea {
      min-height: 125px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--red);
    }

    .consent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
      margin: 4px 0 20px;
    }

    .consent input { margin-top: 4px; }

    .submit-btn {
      width: 100%;
      min-height: 51px;
      border: 0;
      border-radius: 3px;
      background: var(--red);
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: .8px;
      text-transform: uppercase;
      cursor: pointer;
      transition: .2s;
    }

    .submit-btn:hover { background: var(--red-dark); }

    #formMessage {
      margin-top: 15px;
      font-size: 13px;
      font-weight: 700;
    }

    #formMessage:not(:empty) {
      padding: 12px;
      background: #f0f5f2;
      border-left: 3px solid #3c9566;
    }

    .disclaimer {
      margin-top: 22px;
      padding: 13px 15px;
      background: #fff8e9;
      border-left: 3px solid var(--gold);
      color: #78613a;
      font-size: 11px;
    }

    .footer {
      background: #0b121a;
      color: #fff;
      padding: 65px 0 25px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 55px;
      padding-bottom: 45px;
    }

    .footer-about p {
      max-width: 350px;
      color: #9eabb8;
      font-size: 12px;
      margin-top: 19px;
    }

    .footer h4 {
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .footer-links {
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .footer-links a {
      color: #9eabb8;
      font-size: 12px;
      transition: color .2s;
    }

    .footer-links a:hover { color: #fff; }

    .footer-bottom {
      padding-top: 22px;
      border-top: 1px solid rgba(255,255,255,.1);
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #7f8c99;
      font-size: 10px;
    }

    .footer-bottom a { color: #c6d0d9; }

    @media (max-width: 950px) {
      .nav-links { gap: 14px; }
      .nav-links a { font-size: 11px; }
      .about-grid, .structure-grid { gap: 35px; }
      .values-grid { grid-template-columns: repeat(2, 1fr); }
      .application-layout { gap: 25px; }
    }

    @media (max-width: 760px) {
      .topbar-right { display: none; }
      .nav { min-height: 72px; }
      .menu-toggle { display: block; }
      .nav-links {
        display: none;
